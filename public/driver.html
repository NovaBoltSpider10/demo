<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>TourMarket - Driver Roster</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; background-color: #f4f7fb; color: #333; }
    .topbar {
      background: #0056b3;
      color: #fff;
      padding: 14px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .topbar a { color: #fff; text-decoration: none; font-weight: bold; margin-left: 16px; }
    .container { max-width: 1020px; margin: 32px auto; padding: 0 20px; }
    h1, h2 { color: #0056b3; margin-top: 0; }
    form { background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 30px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    @media (max-width: 720px) { .grid-2 { grid-template-columns: 1fr; } }
    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
    input, select { width: 100%; padding: 9px; border: 1px solid #ccd4e0; border-radius: 6px; font-size: 14px; }
    button { background: #0056b3; color: white; padding: 9px 15px; border: none; border-radius: 6px; cursor: pointer; margin-right: 6px; font-weight: bold; }
    button:hover { background: #004085; }
    button.secondary { background: #6c757d; }
    button.danger { background: #c82333; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 15px; }
    .toolbar input, .toolbar select { max-width: 220px; background: #fff; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 10px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    th, td { padding: 12px 14px; border-bottom: 1px solid #e6ecf5; text-align: left; font-size: 14px; }
    th { background-color: #0056b3; color: white; }
    .alert { padding: 12px 15px; border-radius: 6px; margin-bottom: 20px; display: none; }
    .alert.error { background: #f8d7da; color: #721c24; }
    .alert.success { background: #d4edda; color: #155724; }
  </style>
</head>
<body>
  <div class="topbar">
    <div><strong>TourMarket</strong>  |  Driver Roster Portal</div>
    <div>
      <a href="index.html">All Portals</a>
      <a href="fleet_business.html">Fleet Partners</a>
      <a href="vehicle.html">Vehicles</a>
      <a href="booking.html">Dispatch</a>
    </div>
  </div>

  <div class="container">
    <div id="alert" class="alert"></div>

    <form id="driver-form">
      <h2 id="form-title">Onboard Driver</h2>
      <input type="hidden" id="editing_id">

      <div class="form-group">
        <label for="fleet_business_id">Employing Fleet Partner</label>
        <select id="fleet_business_id" required></select>
      </div>

      <div class="grid-2">
        <div class="form-group">
          <label for="first_name">First Name</label>
          <input type="text" id="first_name" required>
        </div>
        <div class="form-group">
          <label for="last_name">Last Name</label>
          <input type="text" id="last_name" required>
        </div>
        <div class="form-group">
          <label for="date_of_birth">Date of Birth</label>
          <input type="date" id="date_of_birth" required>
        </div>
        <div class="form-group">
          <label for="sex">Gender / Sex (optional)</label>
          <input type="text" id="sex">
        </div>
        <div class="form-group">
          <label for="address">Street Address (optional)</label>
          <input type="text" id="address" placeholder="e.g., 410 Elm St, Dallas, TX">
        </div>
        <div class="form-group">
          <label for="pincode">Postal / ZIP Code (optional)</label>
          <input type="text" id="pincode" placeholder="e.g., 75201">
        </div>
        <div class="form-group">
          <label for="email">Driver Email</label>
          <input type="email" id="email" required>
        </div>
        <div class="form-group">
          <label for="phone">Driver Phone</label>
          <input type="tel" id="phone" required>
        </div>
        <div class="form-group">
          <label for="experience_years">Years of Experience</label>
          <input type="number" step="0.1" min="0" id="experience_years" required>
        </div>
        <div class="form-group">
          <label for="rating">Rating (0.00–5.00, optional)</label>
          <input type="number" step="0.01" min="0" max="5" id="rating">
        </div>
      </div>

      <div class="form-group">
        <label for="available">Dispatch Status</label>
        <select id="available">
          <option value="1">Available for Dispatch</option>
          <option value="0">Off Duty / Unavailable</option>
        </select>
      </div>

      <button type="submit">Save Driver</button>
      <button type="button" class="secondary" id="cancel-btn" style="display:none;">Cancel Edit</button>
    </form>

    <h2>Active Driver Roster</h2>
    <div class="toolbar">
      <input type="text" id="search-input" placeholder="Search name, email, phone...">
      <select id="avail-filter">
        <option value="">All Statuses</option>
        <option value="1">Available Only</option>
        <option value="0">Off Duty Only</option>
      </select>
      <button type="button" id="filter-btn">Filter</button>
      <button type="button" class="secondary" id="reset-btn">Reset</button>
    </div>
    <table>
      <thead>
        <tr>
          <th>Driver #</th>
          <th>Name</th>
          <th>Fleet Partner</th>
          <th>Phone</th>
          <th>Experience</th>
          <th>Rating</th>
          <th>Status</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="driver-tbody"></tbody>
    </table>
  </div>

  <script>
    const form = document.getElementById('driver-form');
    const tbody = document.getElementById('driver-tbody');
    const alertEl = document.getElementById('alert');

    function showAlert(msg, type = 'error') {
      alertEl.textContent = msg;
      alertEl.className = `alert ${type}`;
      alertEl.style.display = 'block';
    }
    function clearAlert() { alertEl.style.display = 'none'; }

    async function loadFleetsDropdown() {
      const res = await fetch('/api/fleets');
      const fleets = await res.json();
      const sel = document.getElementById('fleet_business_id');
      sel.innerHTML = '<option value="">-- Select Fleet Partner --</option>';
      for (const f of fleets) {
        const opt = document.createElement('option');
        opt.value = f.fleet_business_id;
        opt.textContent = `${f.business_name} (#${f.fleet_business_id})`;
        sel.appendChild(opt);
      }
    }

    function resetForm() {
      form.reset();
      document.getElementById('editing_id').value = '';
      document.getElementById('form-title').textContent = 'Onboard Driver';
      document.getElementById('cancel-btn').style.display = 'none';
    }
    document.getElementById('cancel-btn').addEventListener('click', resetForm);

    async function loadDrivers() {
      clearAlert();
      const q = encodeURIComponent(document.getElementById('search-input').value.trim());
      const available = encodeURIComponent(document.getElementById('avail-filter').value);
      const res = await fetch(`/api/drivers?q=${q}&available=${available}`);
      const rows = await res.json();
      tbody.innerHTML = '';

      for (const d of rows) {
        const tr = document.createElement('tr');
        const ratingStr = d.rating !== null && d.rating !== undefined ? Number(d.rating).toFixed(2) : '-';
        const fleetLabel = d.business_name ? `${d.business_name} (#${d.fleet_business_id})` : `#${d.fleet_business_id}`;
        [
          `#${d.driver_id}`,
          `${d.first_name} ${d.last_name}`,
          fleetLabel,
          d.phone,
          `${d.experience_years} yrs`,
          ratingStr,
          d.available ? 'Available' : 'Off Duty'
        ].forEach((val) => {
          const td = document.createElement('td');
          td.textContent = val;
          tr.appendChild(td);
        });

        const actionsTd = document.createElement('td');
        const editBtn = document.createElement('button');
        editBtn.textContent = 'Edit';
        editBtn.type = 'button';
        editBtn.onclick = () => {
          document.getElementById('editing_id').value = d.driver_id;
          document.getElementById('fleet_business_id').value = d.fleet_business_id;
          document.getElementById('first_name').value = d.first_name;
          document.getElementById('last_name').value = d.last_name;
          document.getElementById('date_of_birth').value = String(d.date_of_birth || '').slice(0, 10);
          document.getElementById('sex').value = d.sex || '';
          document.getElementById('address').value = d.address || '';
          document.getElementById('pincode').value = d.pincode || '';
          document.getElementById('email').value = d.email;
          document.getElementById('phone').value = d.phone;
          document.getElementById('experience_years').value = d.experience_years;
          document.getElementById('rating').value = d.rating ?? '';
          document.getElementById('available').value = d.available ? '1' : '0';
          document.getElementById('form-title').textContent = `Update Driver #${d.driver_id}`;
          document.getElementById('cancel-btn').style.display = 'inline-block';
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };

        const delBtn = document.createElement('button');
        delBtn.textContent = 'Remove';
        delBtn.type = 'button';
        delBtn.className = 'danger';
        delBtn.onclick = async () => {
          if (!confirm(`Remove Driver #${d.driver_id}?`)) return;
          const delRes = await fetch(`/api/drivers/${d.driver_id}`, { method: 'DELETE' });
          if (!delRes.ok) {
            const err = await delRes.json();
            return showAlert(err.error || 'Delete failed');
          }
          await loadDrivers();
          showAlert('Driver removed.', 'success');
        };

        actionsTd.append(editBtn, delBtn);
        tr.appendChild(actionsTd);
        tbody.appendChild(tr);
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      clearAlert();
      const id = document.getElementById('editing_id').value;
      const payload = {
        fleet_business_id: document.getElementById('fleet_business_id').value,
        first_name: document.getElementById('first_name').value.trim(),
        last_name: document.getElementById('last_name').value.trim(),
        date_of_birth: document.getElementById('date_of_birth').value,
        sex: document.getElementById('sex').value.trim(),
        address: document.getElementById('address').value.trim(),
        pincode: document.getElementById('pincode').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        experience_years: document.getElementById('experience_years').value,
        rating: document.getElementById('rating').value,
        available: document.getElementById('available').value
      };

      const res = await fetch(id ? `/api/drivers/${id}` : '/api/drivers', {
        method: id ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (!res.ok) return showAlert(data.error || 'Save failed');

      resetForm();
      await loadDrivers();
      showAlert(id ? 'Driver updated.' : 'Driver added to roster.', 'success');
    });

    document.getElementById('filter-btn').addEventListener('click', loadDrivers);
    document.getElementById('reset-btn').addEventListener('click', () => {
      document.getElementById('search-input').value = '';
      document.getElementById('avail-filter').value = '';
      loadDrivers();
    });

    loadFleetsDropdown().then(loadDrivers);
  </script>
</body>
</html>
